name: Reusable Semver Label Check

# Fails a PR until it carries exactly one of the labels major, minor or patch.
# The semver build uses these labels to pick the next version.
#
# Call it from a workflow triggered by
#   pull_request:
#     types: [opened, reopened, labeled, unlabeled, synchronize]

on:
  workflow_call:

jobs:
  semver-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require one of major/minor/patch
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          found=$(jq -r '.[] | ascii_downcase | select(. == "major" or . == "minor" or . == "patch")' <<< "$LABELS")
          count=$(grep -c . <<< "$found" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Add exactly one of the labels major, minor or patch (found: $(echo ${found:-none}))."
            exit 1
          fi
          echo "Semver label: $found"
