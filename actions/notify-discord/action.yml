name: 'Notify Discord'
description: 'Sends a Discord webhook notification for a new build. Supports multiple webhook endpoints.'

inputs:
  webhook_urls:
    description: 'Newline-separated list of Discord webhook URLs'
    required: true
  is_dev:
    description: 'Whether this is a dev build'
    required: false
    default: 'false'
  log_file:
    description: 'Path to the Maven build log file'
    required: false
    default: 'log.txt'
  artifact_filter:
    description: 'Regex fragment to filter artifact ID (useful for multi-module builds). Default matches any artifact.'
    required: false
    default: '.*?'
  build_name:
    description: 'Name of the build (e.g. 1.2.1-dev.3) to title the message with. Empty to take it from the uploaded jar.'
    required: false
    default: ''
  commit:
    description: 'Commit the build was made from, linked in the message'
    required: false
    default: ''
  release_url:
    description: 'Page to link the title to (e.g. the GitHub release). Empty to link the uploaded jar.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      shell: bash
      run: pip install simplejson requests
    - name: Send notifications
      shell: bash
      env:
        WEBHOOK_URLS: ${{ inputs.webhook_urls }}
        IS_DEV: ${{ inputs.is_dev }}
        LOG_FILE: ${{ inputs.log_file }}
        ARTIFACT_FILTER: ${{ inputs.artifact_filter }}
        BUILD_NAME: ${{ inputs.build_name }}
        COMMIT: ${{ inputs.commit }}
        RELEASE_URL: ${{ inputs.release_url }}
      run: python ${{ github.action_path }}/notify_published.py
